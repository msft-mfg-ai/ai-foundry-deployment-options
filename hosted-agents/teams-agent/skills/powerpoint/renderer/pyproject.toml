[project]
name = "zava-pptx-renderer"
version = "0.1.0"
description = "Deterministic DeckSpec-to-PowerPoint renderer for the Zava template"
requires-python = ">=3.11"
dependencies = [
  "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
  "pymupdf>=1.28.2",
  "pytest>=8.3.5",
]

[project.scripts]
zava-render = "zava_renderer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zava_renderer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
