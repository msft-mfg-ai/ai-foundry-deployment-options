# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: foundry-perf-testing
services:
    mcp-server:
        project: services/mcp-server
        host: containerapp
        language: python
        docker:
            path: Dockerfile
    support-agent-custom:
        project: services/support-agent-custom
        host: containerapp
        language: dotnet
        docker:
            path: Dockerfile
            context: ..
    support-agent-hosted-bypass-mock:
        project: services/support-agent-hosted
        host: azure.ai.agent
        docker:
            path: Dockerfile
            context: ..
        container:
            resources:
                cpu: "1.0"
                memory: 2Gi
        description: |
            Hosted-agent BYPASS variant, mock lane. Same container as the
            standard hosted agents, but USE_APIM_DIRECT=true routes the model
            call via AzureOpenAIClient → APIM /inference-mock, bypassing the
            Foundry project-connection / data-proxy hop. Uses the agent's
            Instance MI for AAD auth to APIM (Cognitive Services OpenAI User
            granted at Foundry account scope via grant-hosted-bypass-role.sh).
            Purpose: isolate Foundry data-proxy overhead from AgentHost cost.
        displayName: Support Agent (Hosted bypass, mock lane)
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${CHAT_MODEL}
            - name: APIM_BASE_URL
              value: ${APIM_BASE_URL}/inference-mock
            - name: USE_APIM_DIRECT
              value: "true"
            - name: WITH_TOOLS
              value: "false"
        kind: hosted
        metadata:
            tags:
                - perf-testing
                - support-agent
                - hosted
                - bypass
                - mock
                - AI Agent Hosting
                - Agent Framework
        name: support-agent-hosted-bypass-mock
        protocols:
            - protocol: responses
              version: 2.0.0
    support-agent-hosted-bypass-real:
        project: services/support-agent-hosted
        host: azure.ai.agent
        docker:
            path: Dockerfile
            context: ..
        container:
            resources:
                cpu: "1.0"
                memory: 2Gi
        description: |
            Hosted-agent BYPASS variant, real lane. USE_APIM_DIRECT=true
            routes through AzureOpenAIClient → APIM /inference against real
            gpt-5-mini, with MCP tools attached. Uses the agent's Instance
            MI for AAD auth.
        displayName: Support Agent (Hosted bypass, real lane)
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${CHAT_MODEL}
            - name: APIM_BASE_URL
              value: ${APIM_BASE_URL}/inference
            - name: USE_APIM_DIRECT
              value: "true"
            - name: WITH_TOOLS
              value: "true"
            - name: MCP_SERVER_URL
              value: ${MCP_SERVER_URL}
        kind: hosted
        metadata:
            tags:
                - perf-testing
                - support-agent
                - hosted
                - bypass
                - real
                - AI Agent Hosting
                - Agent Framework
                - MCP
        name: support-agent-hosted-bypass-real
        protocols:
            - protocol: responses
              version: 2.0.0
    support-agent-hosted-mock:
        project: services/support-agent-hosted
        host: azure.ai.agent
        docker:
            path: Dockerfile
            context: ..
        container:
            resources:
                cpu: "1.0"
                memory: 2Gi
        description: |
            Customer-support agent (C# / Microsoft.Agents.AI) — MOCK perf lane.
            No MCP tools attached (WITH_TOOLS=false). Routes to APIM
            /inference-mock which returns a canned Chat Completions response.
            Purpose: measure Foundry + agent-framework overhead in isolation
            from model latency and tool-call round-trips.
        displayName: Support Agent (Hosted, mock lane)
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${CHAT_MODEL_VIA_APIM_MOCK}
            - name: WITH_TOOLS
              value: "false"
        kind: hosted
        metadata:
            tags:
                - perf-testing
                - support-agent
                - hosted
                - mock
                - AI Agent Hosting
                - Agent Framework
        name: support-agent-hosted-mock
        protocols:
            - protocol: responses
              version: 2.0.0
    support-agent-hosted-real:
        project: services/support-agent-hosted
        host: azure.ai.agent
        docker:
            path: Dockerfile
            context: ..
        container:
            resources:
                cpu: "1.0"
                memory: 2Gi
        description: |
            Customer-support agent (C# / Microsoft.Agents.AI) — REAL perf lane.
            MCP case-management tools attached (WITH_TOOLS=true). Routes to
            APIM /inference against real gpt-5-mini. Purpose: end-to-end
            hosted-agent latency on the actual customer-support workload.
        displayName: Support Agent (Hosted, real lane)
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${CHAT_MODEL_VIA_APIM}
            - name: WITH_TOOLS
              value: "true"
            - name: MCP_SERVER_URL
              value: ${MCP_SERVER_URL}
        kind: hosted
        metadata:
            tags:
                - perf-testing
                - support-agent
                - hosted
                - real
                - AI Agent Hosting
                - Agent Framework
                - MCP
        name: support-agent-hosted-real
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: bicep
    path: .
    module: main
hooks:
    postdeploy:
        windows:
            shell: pwsh
            run: |
                Write-Host "── Seeding prompt agent ──"
                bash ./scripts/seed-prompt-agent.sh
                Write-Host "── Granting Instance MI roles to hosted-bypass agents ──"
                bash ./scripts/grant-hosted-bypass-role.sh
        posix:
            shell: sh
            run: |
                set -eu
                echo "── Seeding prompt agent ──"
                sh ./scripts/seed-prompt-agent.sh
                echo "── Granting Instance MI roles to hosted-bypass agents ──"
                sh ./scripts/grant-hosted-bypass-role.sh
    postprovision:
        windows:
            shell: pwsh
            run: |
                Write-Host "── Perf-testing infra ready ──"
                Write-Host "PROJECT_ENDPOINT=$env:PROJECT_ENDPOINT"
                Write-Host "CHAT_MODEL=$env:CHAT_MODEL"
                Write-Host "MCP_SERVER_URL=$env:MCP_SERVER_URL"
                Write-Host "SERVICE_SUPPORT_AGENT_CUSTOM_ENDPOINT=$env:SERVICE_SUPPORT_AGENT_CUSTOM_ENDPOINT"
                Write-Host ""
                Write-Host "Next: run 'azd deploy' to push the three service containers."
                Write-Host "The prompt agent is created automatically by the postdeploy hook."
                Write-Host "Then run the perf harness: perf/run.sh"
        posix:
            shell: sh
            run: |
                set -eu
                echo "── Perf-testing infra ready ──"
                echo "PROJECT_ENDPOINT=${PROJECT_ENDPOINT}"
                echo "CHAT_MODEL=${CHAT_MODEL}"
                echo "MCP_SERVER_URL=${MCP_SERVER_URL}"
                echo "SERVICE_SUPPORT_AGENT_CUSTOM_ENDPOINT=${SERVICE_SUPPORT_AGENT_CUSTOM_ENDPOINT}"
                echo ""
                echo "Next: run 'azd deploy' to push the three service containers."
                echo "The prompt agent is created automatically by the postdeploy hook."
                echo "Then run the perf harness: perf/run.sh"
    preprovision:
        windows:
            shell: pwsh
            run: |
                $ErrorActionPreference = "Stop"
                if (-not $env:CHAT_MODEL) { azd env set CHAT_MODEL "gpt-5-mini" }
        posix:
            shell: sh
            run: |
                set -eu
                if [ -z "${CHAT_MODEL:-}" ]; then
                  azd env set CHAT_MODEL "gpt-5-mini"
                fi
