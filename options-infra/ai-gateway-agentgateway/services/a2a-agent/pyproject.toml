[project]
name = "agentgateway-a2a-agent"
version = "0.1.0"
description = "Deterministic sample A2A service for the agentgateway deployment option."
requires-python = ">=3.12"
dependencies = [
  "azure-monitor-opentelemetry>=1.8,<2",
  "starlette>=0.48,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[project.scripts]
a2a-agent = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

