[project]
name = "agentgateway-mcp-server"
version = "0.1.0"
description = "Stateless sample MCP service for the agentgateway deployment option."
requires-python = ">=3.12"
dependencies = [
  "azure-monitor-opentelemetry>=1.8,<2",
  "fastmcp>=3.4,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
]

[project.scripts]
mcp-server = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
