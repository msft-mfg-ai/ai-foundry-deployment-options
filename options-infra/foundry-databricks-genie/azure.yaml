name: foundry-databricks-genie

infra:
  provider: bicep
  path: .
  module: main

hooks:
  preprovision:
    windows:
      shell: pwsh
      run: scripts/preprovision-databricks-automation.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: scripts/preprovision-databricks-automation.sh
      interactive: true
      continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      run: |
        uv sync --project ..\..\agents_v2
        uv run --project ..\..\agents_v2 python ..\..\agents_v2\setup_databricks_genie.py
        $connectionReady = azd env get-value DATABRICKS_FOUNDRY_CONNECTION_READY 2>$null
        if ($connectionReady -eq 'true') {
          uv run --project ..\..\agents_v2 python ..\..\agents_v2\create_genie_agent.py
        } else {
          Write-Host 'Skipping Foundry agent creation until the Databricks OAuth connection is ready.'
        }
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: |
        uv sync --project ../../agents_v2
        uv run --project ../../agents_v2 python ../../agents_v2/setup_databricks_genie.py
        connection_ready=$(azd env get-value DATABRICKS_FOUNDRY_CONNECTION_READY 2>/dev/null) || connection_ready="false"
        if [ "$connection_ready" = "true" ]; then
          uv run --project ../../agents_v2 python ../../agents_v2/create_genie_agent.py
        else
          echo "Skipping Foundry agent creation until the Databricks OAuth connection is ready."
        fi
      interactive: true
      continueOnError: false
