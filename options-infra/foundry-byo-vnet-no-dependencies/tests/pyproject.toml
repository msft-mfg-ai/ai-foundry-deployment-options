[project]
name = "foundry-byo-vnet-no-dependencies-tests"
version = "0.1.0"
description = "Live integration tests for hosted and prompt agents across capability-host configurations"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.2",
    "azure-identity>=1.25.0",
    "dnspython>=2.7.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
addopts = "-v -s --tb=short -ra"
asyncio_mode = "auto"
testpaths = ["."]

[tool.uv.workspace]
members = [
    ".",
]
