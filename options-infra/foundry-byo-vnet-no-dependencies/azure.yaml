# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.7'
name: foundry-byo-vnet-no-dependencies
services:
    hosted-agent-no-cap:
        project: .hosted-agent-build/vnet-mcp-agent
        host: azure.ai.agent
        language: python
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Hosted Agent Framework assistant deployed to the project without a capability host.
        displayName: Hosted Agent - No Capability Host
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME}
            - name: AZURE_AI_PROJECT_ID
              value: ${AZURE_AI_PROJECT_ID_NO_CAP}
            - name: MCP_SERVER_URL
              value: ${SAMPLE_MCP_SERVER_URL}
            - name: MCP_SERVER_NAME
              value: sample-mcp
        kind: hosted
        metadata:
            tags:
                - sample
                - hosted
                - Agent Framework
                - MCP
                - no-capability-host
        name: hosted-agent-no-cap
        protocols:
            - protocol: responses
              version: 2.0.0
    hosted-agent-with-cap:
        project: .hosted-agent-build/vnet-mcp-agent
        host: azure.ai.agent
        language: python
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Hosted Agent Framework assistant deployed to the project with a capability host.
        displayName: Hosted Agent - With Capability Host
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME}
            - name: AZURE_AI_PROJECT_ID
              value: ${AZURE_AI_PROJECT_ID_WITH_CAP}
            - name: MCP_SERVER_URL
              value: ${SAMPLE_MCP_SERVER_URL}
            - name: MCP_SERVER_NAME
              value: sample-mcp
        kind: hosted
        metadata:
            tags:
                - sample
                - hosted
                - Agent Framework
                - MCP
                - capability-host
        name: hosted-agent-with-cap
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: bicep
    path: .
    module: main
hooks:
    prepackage:
        windows:
            shell: pwsh
            run: |
                & '../scripts/sync-hosted-agents.ps1' @(
                  '../../hosted-agents/vnet-mcp-agent=.hosted-agent-build/vnet-mcp-agent'
                )
        posix:
            shell: sh
            run: |
                set -eu
                sh ../scripts/sync-hosted-agents.sh \
                  ../../hosted-agents/vnet-mcp-agent=.hosted-agent-build/vnet-mcp-agent
