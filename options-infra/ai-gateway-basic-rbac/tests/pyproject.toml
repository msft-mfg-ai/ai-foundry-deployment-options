[project]
name = "ai-gateway-basic-rbac-tests"
version = "0.1.0"
description = "Foundry RBAC validation harness (pytest). See ../../../foundry-rbac-*.html for spec."
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.0",
    "azure-mgmt-authorization>=4.0.0",
    "azure-mgmt-resource>=23.1.0",
    "azure-ai-projects==2.0.1",
    "openai>=2.31.0",
    "aiohttp>=3.10.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
addopts = "-v -s --tb=short -ra"
testpaths = ["."]
python_files = ["test_*.py"]
