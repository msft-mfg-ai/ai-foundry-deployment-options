name: 'Bicep: foundry-teams-hosted'

on:
  push:
    branches: [main]
    paths:
      - 'options-infra/foundry-teams-hosted/**'
      - 'hosted-agents/teams-agent/**'
      - 'hosted-agents/toolbox-agent/**'
      - 'options-infra/modules/**'
      - '.github/workflows/bicep-validate-reusable.yml'
  pull_request:
    branches: [main]
    paths:
      - 'options-infra/foundry-teams-hosted/**'
      - 'hosted-agents/teams-agent/**'
      - 'hosted-agents/toolbox-agent/**'
      - 'options-infra/modules/**'
      - '.github/workflows/bicep-validate-reusable.yml'

jobs:
  validate:
    uses: ./.github/workflows/bicep-validate-reusable.yml
    with:
      bicep-file: main.bicep
      working-directory: options-infra/foundry-teams-hosted
