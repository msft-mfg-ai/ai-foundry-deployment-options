name: 'Bicep: foundry-byo-vnet-no-dependencies'

on:
  push:
    branches: [main]
    paths:
      - 'options-infra/foundry-byo-vnet-no-dependencies/**'
      - 'hosted-agents/vnet-mcp-agent/**'
      - 'options-infra/scripts/sync-hosted-agents.*'
      - 'options-infra/modules/**'
      - '.github/workflows/bicep-validate-reusable.yml'
  pull_request:
    branches: [main]
    paths:
      - 'options-infra/foundry-byo-vnet-no-dependencies/**'
      - 'hosted-agents/vnet-mcp-agent/**'
      - 'options-infra/scripts/sync-hosted-agents.*'
      - 'options-infra/modules/**'
      - '.github/workflows/bicep-validate-reusable.yml'

jobs:
  validate:
    uses: ./.github/workflows/bicep-validate-reusable.yml
    with:
      bicep-file: main.bicep
      working-directory: options-infra/foundry-byo-vnet-no-dependencies
